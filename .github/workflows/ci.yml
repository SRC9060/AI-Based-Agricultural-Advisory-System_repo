name: CI

on:
  push:
    branches: ["main", "dev", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start production PWA
        run: |
          npm start > /tmp/agriadvisor-frontend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/agriadvisor-frontend.log
          exit 1
      - name: Verify Lighthouse mobile thresholds
        run: >
          npx lighthouse http://127.0.0.1:3000/login
          --only-categories=performance,pwa
          --form-factor=mobile
          --throttling-method=simulate
          --chrome-flags="--headless --no-sandbox"
          --output=json
          --output=html
          --output-path=./lighthouse-ci
      - run: node scripts/check-lighthouse.mjs lighthouse-ci.report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile-report
          path: |
            frontend/lighthouse-ci.report.html
            frontend/lighthouse-ci.report.json

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/req.txt
      - name: Install backend test dependencies
        run: python -m pip install fastapi pydantic sqlalchemy python-dotenv redis
      - name: Compile backend source
        run: python -m compileall -q .
      - name: Run backend security tests
        env:
          AUTH_SECRET_KEY: ci-test-secret-that-is-long-and-not-used-in-production
        run: python -m unittest discover -s tests -v
