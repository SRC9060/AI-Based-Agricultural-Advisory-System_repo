services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/users.db
    ports:
      - "8000:8000"
    volumes:
      - agriadvisor-data:/app/data

  worker:
    build: ./backend
    command: ["python", "-m", "services.agent_worker"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/users.db
    volumes:
      - agriadvisor-data:/app/data
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  agriadvisor-data:
