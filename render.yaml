services:
  - type: keyvalue
    name: agriadvisor-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: agriadvisor-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agriadvisor-redis
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_TRUST_PROXY
        value: "true"
      - key: KNOWLEDGE_BASE_PATH
        value: /app/knowledge_base
      - key: CHROMA_DB_PATH
        value: /app/chroma_db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: AGMARKNET_BASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: AGENT_WORKER_MODE
        value: "disabled"

  - type: web
    name: agriadvisor-pwa
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

